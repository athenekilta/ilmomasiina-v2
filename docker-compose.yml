services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    volumes:
      - event-images:/app/data/event-images
    environment:
      - EVENT_IMAGE_STORAGE_DIR=/app/data/event-images
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/ilmomasiina?schema=public
    depends_on:
      db:
        condition: service_healthy

  realtime:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    command: ["./node_modules/.bin/tsx", "src/server/realtime/server.ts"]
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3001:3001"
    env_file:
      - .env
    environment:
      - LIVE_HOST=0.0.0.0
      - LIVE_PORT=3001
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/ilmomasiina?schema=public
    depends_on:
      db:
        condition: service_healthy
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    restart: unless-stopped
    init: true
    env_file:
      - .env
    volumes:
      - event-images:/app/data/event-images
    environment:
      - EVENT_IMAGE_STORAGE_DIR=/app/data/event-images
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/ilmomasiina?schema=public
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:18-trixie
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  event-images:
  postgres-data:
